name: APK de Android

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    # Ubuntu 24.04 trae el SDK de Android preinstalado (ANDROID_HOME)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Comprobar SDK de Android
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools"

      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx cap sync android

      - name: Compilar APK de depuración
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk "app/build/outputs/apk/debug/Di en Di.apk"

      - uses: actions/upload-artifact@v5
        with:
          name: di-en-di-apk
          path: "android/app/build/outputs/apk/debug/Di en Di.apk"
