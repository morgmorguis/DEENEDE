name: APK de Android

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    # Ubuntu 24.04 trae el SDK de Android preinstalado (ANDROID_HOME)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Comprobar SDK de Android
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools"

      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx cap sync android

      - name: Compilar APK de depuración
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk "app/build/outputs/apk/debug/Di en Di.apk"

      - uses: actions/upload-artifact@v5
        with:
          name: di-en-di-apk
          path: "android/app/build/outputs/apk/debug/Di en Di.apk"

  servidor-windows:
    # Servidor de partida para el PC del DM: un .exe con la app web dentro
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build
      - run: npm run server:build

      - name: Empaquetar .exe (servidor del DM y app para jugadores)
        run: |
          npx --yes @yao-pkg/pkg@6 server/build/server.cjs --targets node22-win-x64 --output "server/build/Di en Di - Servidor.exe" --config server/pkg.json
          npx --yes @yao-pkg/pkg@6 server/build/app.cjs --targets node22-win-x64 --output "server/build/Di en Di.exe" --config server/pkg.json

      - name: Poner iconos y datos a los .exe (resedit, compatible con pkg)
        shell: pwsh
        run: |
          $v = (Get-Content package.json | ConvertFrom-Json).version
          npx --yes resedit-cli@3 --in "server/build/Di en Di - Servidor.exe" --out "server/build/Di en Di - Servidor.exe" --icon 1,build/icons/server.ico --ignore-signed --product-name "Di en Di - Servidor" --file-description "Servidor de partida de Di en Di" --company-name "Di en Di" --product-version "$v.0" --file-version "$v.0"
          npx --yes resedit-cli@3 --in "server/build/Di en Di.exe" --out "server/build/Di en Di.exe" --icon 1,build/icons/app.ico --ignore-signed --product-name "Di en Di" --file-description "Di en Di - D&D 2024 companion" --company-name "Di en Di" --product-version "$v.0" --file-version "$v.0"

      - name: Probar que el .exe arranca y sirve la app
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "server/build/Di en Di - Servidor.exe" -ArgumentList "--no-open","--no-publish","--port","3123","--data","$env:RUNNER_TEMP/partida.json" -PassThru
          Start-Sleep -Seconds 4
          $info = Invoke-RestMethod http://localhost:3123/api/info
          if ($info.app -ne 'di-en-di') { throw "El servidor no responde" }
          $html = (Invoke-WebRequest http://localhost:3123/ -UseBasicParsing).Content
          if ($html -notmatch 'id="root"') { throw "No sirve la app web" }
          Write-Host "Servidor OK, código $($info.code)"
          Stop-Process -Id $p.Id
          $a = Start-Process -FilePath "server/build/Di en Di.exe" -ArgumentList "--no-open" -PassThru
          Start-Sleep -Seconds 4
          $app = (Invoke-WebRequest http://127.0.0.1:47800/ -UseBasicParsing).Content
          if ($app -notmatch 'id="root"') { throw "La app de Windows no sirve la web" }
          Write-Host "App de Windows OK"
          Stop-Process -Id $a.Id

      - name: Preparar descarga
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item "server/build/Di en Di - Servidor.exe" out/
          Copy-Item "server/build/Di en Di.exe" out/
          Copy-Item server/LEEME.txt out/

      - uses: actions/upload-artifact@v5
        with:
          name: di-en-di-windows
          path: out/

  release:
    # Una release en GitHub por cada versión nueva (la de package.json): etiqueta vX.Y.Z, notas del
    # CHANGELOG y el APK y los .exe para descargar. Si la versión ya tiene release, no hace nada.
    needs: [build, servidor-windows]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5

      - name: Versión
        id: v
        run: |
          V=$(node -p "require('./package.json').version")
          echo "version=$V" >> "$GITHUB_OUTPUT"
          if gh release view "v$V" > /dev/null 2>&1; then
            echo "La release v$V ya existe: no se crea otra"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/download-artifact@v5
        if: steps.v.outputs.exists == 'false'
        with:
          path: artefactos

      - name: Crear la release
        if: steps.v.outputs.exists == 'false'
        run: |
          V=${{ steps.v.outputs.version }}
          # Notas: la entrada de esta versión en CHANGELOG.md (desde su «## X.Y.Z» hasta la siguiente)
          awk -v v="$V" '/^## / { if (on) exit; if (index($0, "## " v " ") == 1) { on = 1; next } } on' CHANGELOG.md > notas.md
          TITLE=$(grep -m1 "^## $V " CHANGELOG.md | sed 's/^## //')
          [ -s notas.md ] || echo "Versión $V." > notas.md
          cat >> notas.md <<NOTAS

          ---
          **Descargas**
          - **Android**: \`Di-en-Di-$V.apk\` (instálalo encima de la versión anterior sin perder datos).
          - **Windows**: \`Di-en-Di-$V.exe\` (la app) y \`Di-en-Di-Servidor-$V.exe\` (servidor de partida del DM). Lee \`LEEME.txt\`.
          NOTAS
          mkdir sube
          cp "artefactos/di-en-di-apk/Di en Di.apk" "sube/Di-en-Di-$V.apk"
          cp "artefactos/di-en-di-windows/Di en Di.exe" "sube/Di-en-Di-$V.exe"
          cp "artefactos/di-en-di-windows/Di en Di - Servidor.exe" "sube/Di-en-Di-Servidor-$V.exe"
          cp artefactos/di-en-di-windows/LEEME.txt sube/
          gh release create "v$V" --target "$GITHUB_SHA" --title "${TITLE:-$V}" --notes-file notas.md \
            "sube/Di-en-Di-$V.apk#Android (APK)" \
            "sube/Di-en-Di-$V.exe#Windows: app" \
            "sube/Di-en-Di-Servidor-$V.exe#Windows: servidor del DM" \
            sube/LEEME.txt
